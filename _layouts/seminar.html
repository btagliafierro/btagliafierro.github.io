<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>

  <!-- Sakura CSS Framework -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sakura.css/css/sakura.css" type="text/css">

  <style>
    :root {
      /* ADJUST PAGE WIDTH HERE */
      /* Examples: 800px, 60%, 45em */
      --page-width: 40em; 
    }

    body {
      max-width: var(--page-width);
      font-family: Arial, Helvetica, sans-serif;
      margin: auto;
      padding: 3em 1.5em;
      line-height: 1.5;
    }

    /* Ensuring headings also use Arial */
    h1, h2, h3, h4, h5, h6 {
      font-family: Arial, Helvetica, sans-serif;
      margin-top: 1.2em;
    }

    /* Removes the default Sakura top margin for the first element */
    main > *:first-child {
      margin-top: 0;
    }
  </style>
</head>

<body>

  <main>
    {{ content }}
  </main>

</body>
</html>
